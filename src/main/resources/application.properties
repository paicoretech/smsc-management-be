# port that will be opened on the server to start the application
server.port=8080

# Configuration for Redis Cluster - Jedis
# List of nodes
cluster.nodes=localhost:6379
cluster.threadPool.maxTotal=20
cluster.threadPool.maxIdle=20
cluster.threadPool.minIdle=1
cluster.threadPool.blockWhenExhausted=true
cluster.connection.timeout=2000
cluster.so.timeout=2000
cluster.maxAttempts=20
cluster.connection.user=
cluster.connection.password=
cluster.standalone.enabled=true

# Configuration Redis to management balance credit
# Defines the time in seconds that the credit balance will be updated in Redis and the Database.
server.balancePeriod.store=10
# header key to endpoint that receiver the credits used by default X-API-Key
server.apiKeyHeader.name=X-API-Key
# header value for security by API Key
server.apiKey.value=Cn62uZGdSUeGqmtVnHmI7iaji3C74bRd

# Database Configuration
# connection data
# in the URL the parameter smsc_management is the name of the database
spring.datasource.url=jdbc:postgresql://localhost:5432/smsc_management
# database username
spring.datasource.username=postgres
# database password.
spring.datasource.password=1234

# These values are fixed, they do not require updating
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#logging.level.net.ttddyy.dsproxy.listener=debug
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# default time zone that JPA uses to generate the dates that are inserted into the database.
spring.jpa.properties.hibernate.jdbc.time_zone=America/Managua

# JWT
# This variable is used to encrypt and decrypt the JWT, A SHA 256-bit Key
app.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# This variable is used to set the expiration time of the JWT in seconds
app.security.jwt.expiration=86400

# Root User
app.root.user=admin
app.root.password=admin
app.failed.login.attempts=3
app.clean.failed.login.attempts.hours=1

# WebSocket Authorization
# This value must be defined in the properties of the SMPP|HTTP server as well
websocket.header.name=Authorization
websocket.header.value=fcb13146-ecd7-46a5-b9cb-a1e75fae9bdc

# The origin(s) allowed to accept requests is defined, default *
cors.allowed.origins=*

# broadcast properties
# The amount of record read from the file that will be included in the batch to be sent to the database.
loadCsv.batchSize=10000
# Amount of record that will be included for each batch to generate the message that will be sent to Redis.
processing.batchSize=10
# Amount of record that will get from the database to build the reports.
report.batchSize=10000
#Maximum weight in a request between the backend and the GUI
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
file.download.broadcast.dir=/opt/broadcast/reports/
file.upload.broadcast.dir=/opt/broadcast/uploads/
broadcast.threadpool.size=10
#Defines the time between each review to certify that the broadcast has been created.
broadcast.valid.number.regex=^\\+?\\d+$
broadcast.default-max-execution.seconds=3600

# for upload file
file.upload.dir=/opt/smsc/uploads/

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.concurrency=1
spring.kafka.consumer.reconnect.backoff.ms=1000
spring.kafka.consumer.reconnect.backoff.max.ms=10000
spring.kafka.consumer.session.timeout.ms=30000
spring.kafka.consumer.heartbeat.interval.ms=10000
spring.kafka.producer.reconnect.backoff.ms=1000
spring.kafka.producer.reconnect.backoff.max.ms=10000

# Kafka Producer
# we will ?linger? for the specified time waiting for more records to show up in milliseconds
kafka.producer.linger-ms=5000
# This configuration controls the default batch size in bytes.
kafka.producer.batch-size=32768

# Kafka Consumer
# The maximum number of records returned in a single call to poll().
kafka.consumer.max-poll-records=1000

# Scylla
scylla.contact.points=localhost:9042
scylla.datacenter=datacenter1
scylla.user=scylla
scylla.password=scylla

dnd.msisdn.regex=^[0-9]+$

spring.jpa.open-in-view=false
# Logger
# Log level configuration (info, warn, debug, error, fatal, trace, off)
# logging.level.root=INFO

## service provider JWT
jwt.service.provider.secret=MzAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
jwt.service.provider.iss=smsc-management
jwt.service.provider.clock-skew-seconds=30